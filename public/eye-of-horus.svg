<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#080d1e"/>
      <stop offset="70%" stop-color="#04060d"/>
      <stop offset="100%" stop-color="#010205"/>
    </radialGradient>

    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#0077B6" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#021B35" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030814"/>
    </radialGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#E5A900"/>
    </linearGradient>

    <linearGradient id="cyanRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0FFFF"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0088CC"/>
    </linearGradient>

    <linearGradient id="lightningGlow" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFF275"/>
      <stop offset="75%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>

    <filter id="glow-bolt" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Tactical Rounded Container -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#cyanRim)" stroke-width="3" opacity="0.4"/>
  <rect width="492" height="492" x="10" y="10" rx="98" fill="none" stroke="url(#goldRim)" stroke-width="1.5" opacity="0.25"/>

  <!-- Radar Concentric Grid Circles -->
  <g transform="translate(256, 256)" opacity="0.35">
    <circle cx="0" cy="0" r="215" fill="none" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="4, 8"/>
    <circle cx="0" cy="0" r="165" fill="none" stroke="#00E5FF" stroke-width="1"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#FFD700" stroke-width="0.8" stroke-dasharray="2, 6"/>

    <!-- Crosshair Ticks -->
    <line x1="-230" y1="0" x2="-190" y2="0" stroke="#00E5FF" stroke-width="2"/>
    <line x1="190" y1="0" x2="230" y2="0" stroke="#00E5FF" stroke-width="2"/>
    <line x1="0" y1="-230" x2="0" y2="-190" stroke="#00E5FF" stroke-width="2"/>
    <line x1="0" y1="190" x2="0" y2="230" stroke="#00E5FF" stroke-width="2"/>
  </g>

  <!-- Eye Contour (번개의 눈동자 외곽) -->
  <g transform="translate(256, 256)">
    <!-- Outer Eye Outline -->
    <path d="M-195 0 C-125 -125 125 -125 195 0 C125 125 -125 125 -195 0 Z" 
          fill="#030612" stroke="url(#goldRim)" stroke-width="7" stroke-linejoin="round" filter="url(#glow-cyan)"/>

    <!-- Inner Eye Accent Rim -->
    <path d="M-165 0 C-105 -95 105 -95 165 0 C105 95 -105 95 -165 0 Z" 
          fill="rgba(0, 229, 255, 0.05)" stroke="url(#cyanRim)" stroke-width="3" opacity="0.85"/>

    <!-- Iris (홍채) -->
    <circle cx="0" cy="0" r="82" fill="url(#irisGrad)" stroke="url(#goldRim)" stroke-width="4.5" filter="url(#glow-cyan)"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="6, 4" opacity="0.9"/>
    <circle cx="0" cy="0" r="54" fill="#020409" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>

    <!-- Central Glowing Lightning Bolt (번개 동공) -->
    <g filter="url(#glow-bolt)">
      <polygon points="12,-48 -24,4 6,4 -10,48 26,-4 -4,-4" 
               fill="url(#lightningGlow)" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- Tactical Cardinal Reticle Ticks on Iris -->
    <line x1="0" y1="-82" x2="0" y2="-70" stroke="#FFF" stroke-width="2.5"/>
    <line x1="0" y1="70" x2="0" y2="82" stroke="#FFF" stroke-width="2.5"/>
    <line x1="-82" y1="0" x2="-70" y2="0" stroke="#FFF" stroke-width="2.5"/>
    <line x1="70" y1="0" x2="82" stroke="#FFF" stroke-width="2.5"/>
  </g>

  <!-- Corner Tactical Brackets -->
  <g stroke="#00E5FF" stroke-width="3" opacity="0.6" fill="none">
    <path d="M42 72 L72 72 M42 72 L42 102"/>
    <path d="M470 72 L440 72 M470 72 L470 102"/>
    <path d="M42 440 L72 440 M42 440 L42 410"/>
    <path d="M470 440 L440 440 M470 440 L470 410"/>
  </g>
</svg>
